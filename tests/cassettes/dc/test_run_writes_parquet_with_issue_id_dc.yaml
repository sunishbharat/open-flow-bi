        I managed to get one or more poison messages in my test topic using fairly
        simple single threaded SimpleProducer/SimpleConsumer code. In this state,
        I could see several hundreds of thousands of messages in the topic via JMX
        and adding new messages appeared to succeed from the API calls, however each
        add resulted in the following error: \n\n[2010-12-08 14:56:04,952] ERROR kafka.message.InvalidMessageException
