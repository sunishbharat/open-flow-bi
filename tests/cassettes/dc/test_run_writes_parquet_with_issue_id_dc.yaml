        \"1000000\"); \nprops.put(\"groupid\", \"test_group\"); \n\n// Create the
        connection to the cluster \nConsumerConfig consumerConfig = new ConsumerConfig(props);
        \nConsumerConnector consumerConnector = Consumer.create(consumerConfig); \n\n//
