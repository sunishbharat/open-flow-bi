        Kafka projects","name":"Kafka"}},"aggregatetimespent":null,"customfield_12312520":null,"customfield_12312521":"Wed
        Aug 03 22:17:47 UTC 2011","customfield_12314422":null,"customfield_12314421":null,"customfield_12314146":null,"customfield_12314420":null,"customfield_12314145":null,"customfield_12314144":null,"customfield_12314143":null,"resolutiondate":"2011-08-03T22:17:47.000+0000","workratio":-1,"customfield_12312923":null,"customfield_12312920":null,"customfield_12312921":null,"watches":{"self":"https://issues.apache.org/jira/rest/api/2/issue/KAFKA-75/watchers","watchCount":0,"isWatching":false},"created":"2011-07-26T18:27:15.000+0000","customfield_10022":null,"updated":"2011-08-03T22:17:47.000+0000","timeoriginalestimate":null,"description":"The
        embedded consumer in the kafka mirror implementation uses the low-level Log
        api to create the replica. The append operation may fail and result in a corrupt
        log file, due to an IO error which is currently caught and ignored.\n\nThe
        proposed fix is to switch to using the high-level producer API to create the
        replica. Not only would this avoid the above issue, but it would also fit
        better with the current design of the replication enhancement for kafka (http://linkedin.jira.com/browse/KAFKA-23),
        since the low-level Log api is not replication-aware. Another advantage is
        that compression is exposed at the producer API-level. One caveat in this
        approach would be the following: the async producer drops events when its
        queue is full. This behavior is unsuitable for the embedded consumer, so we
        can expose a configuration option in the producer to allow for (queue-level)
        blocking semantics.\n","customfield_10010":null,"timetracking":{},"customfield_12314523":null,"customfield_12314127":null,"customfield_12314522":null,"customfield_12314126":null,"customfield_12314521":null,"customfield_12314125":null,"customfield_12314520":null,"customfield_12314124":null,"attachment":[],"customfield_12312340":null,"customfield_12314123":null,"customfield_12312341":null,"customfield_12312220":null,"customfield_12314122":null,"customfield_12314121":null,"customfield_12314120":null,"customfield_12314129":null,"customfield_12314524":null,"customfield_12314128":null,"summary":"Kafka
        mirror does not shutdown on IO error","customfield_12314130":null,"customfield_12310291":null,"customfield_12310290":null,"customfield_12314138":null,"customfield_12314137":null,"environment":null,"customfield_12314136":null,"customfield_12314135":null,"customfield_12311020":null,"customfield_12314134":null,"duedate":null,"customfield_12314132":null,"customfield_12314131":null,"comment":{"comments":[{"self":"https://issues.apache.org/jira/rest/api/2/issue/12515439/comment/13071264","id":"13071264","author":{"self":"https://issues.apache.org/jira/rest/api/2/user?username=jjkoshy","name":"jjkoshy","key":"jjkoshy","avatarUrls":{"48x48":"https://issues.apache.org/jira/secure/useravatar?avatarId=10452","24x24":"https://issues.apache.org/jira/secure/useravatar?size=small&avatarId=10452","16x16":"https://issues.apache.org/jira/secure/useravatar?size=xsmall&avatarId=10452","32x32":"https://issues.apache.org/jira/secure/useravatar?size=medium&avatarId=10452"},"displayName":"Joel
        Jacob Koshy","active":true,"timeZone":"Etc/UTC"},"body":"If we use a producer
        to mirror the source cluster, then that brings in the need for a producer
        configuration in addition to the embedded consumer configuration. There are
        some alternatives:\n\n- One ConsumerConfig and one ProducerConfig. i.e., only
        allow mirroring one source cluster at a time. If you need mirrors of multiple
        source clusters, you have to set up one target kafka cluster per source cluster.\n-
        Only one (global) ConsumerConfig and allow multiple values (one per source
        cluster) for the zk.connect property. However, with this approach you cannot
        easily override global configs such as socket.buffersize/timeout (and such
        overrides are often useful for cross-DC mirrors), topic blacklists (when we
        do auto-discovery of topics - SNA-6887), etc.\n- Array of ConsumerConfig (one
        per source cluster to mirror) and one ProducerConfig. We can either instantiate
        multiple embedded consumers or just multiple consumer connectors.\n\nMore
        considerations for ProducerConfig:\n\n- With only one ProducerConfig, identical
        topics from different clusters will get mixed on the target cluster. We could
        have an array of ConsumerConfig/ProducerConfig pairs to avoid this.\n- If
        it makes sense, we can also allow ProducerConfig to be optional to aid in
        smoother deployments of the next release (with the above changes in place).
        In this case, the ProducerConfig will inherit the ZkConfig of the local kafka
        broker.\n","updateAuthor":{"self":"https://issues.apache.org/jira/rest/api/2/user?username=jjkoshy","name":"jjkoshy","key":"jjkoshy","avatarUrls":{"48x48":"https://issues.apache.org/jira/secure/useravatar?avatarId=10452","24x24":"https://issues.apache.org/jira/secure/useravatar?size=small&avatarId=10452","16x16":"https://issues.apache.org/jira/secure/useravatar?size=xsmall&avatarId=10452","32x32":"https://issues.apache.org/jira/secure/useravatar?size=medium&avatarId=10452"},"displayName":"Joel
