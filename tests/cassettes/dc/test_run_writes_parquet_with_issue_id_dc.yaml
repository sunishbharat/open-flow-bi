        \nval consumersPath = \"/consumers\" \nval brokerIdsPath = \"/brokers/ids\"
        \nval brokerTopicsPath = \"/brokers/topics\" \n{noformat} \n\nIf for operational
        reasons if one wants to have logically distinct Kafka clusters share the same
        Zookeeper ensemble the current setup is a little awkward. You have to make
        sure that none of the broker ids, topic names, consumer groups etc are all
        unique. Really you have one giant kafka cluster partitioned by application
        logic. \n\nOptions: \n(A) A configurable root added as a property \"kafka/my-awesome-cluster\".
