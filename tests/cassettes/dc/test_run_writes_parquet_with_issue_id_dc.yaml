        4)); \n// create list of 4 threads to consume from each of the partitions
        \nList<KafkaMessageStream> streams = topicMessageStreams.get(\"test\"); \nExecutorService
        executor = Executors.newFixedThreadPool(4); \n\n// consume the messages in
