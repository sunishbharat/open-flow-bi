[project]
name = "open-flow-bi"
version = "0.1.0"
description = "Self-hosted Jira flow-metrics extractor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # duckdb (local Parquet inspection) and filesystem (s3fs/botocore, cloud buckets
    # only - local Parquet output needs just fsspec, a core dlt dependency) are
    # dev-only, so the runtime image stays small. docs/deployment-cf.md §3.3.
    "dlt[parquet,postgres]>=1.30.0",
    # Imported at runtime by cli.py and quality/checks.py (docs/deployment-cf.md §3.1);
    # narwhals is what pandera.pyarrow imports underneath.
    "narwhals>=2.26.0",
    "pandera>=0.33.1",
    "pendulum>=3.2.0",
    "pydantic-settings",
    "pyrate-limiter>=4.5.0",
    "pyyaml>=6.0.3",
    "rich",
    "structlog",
    "typer",
]

[project.scripts]
flowbi = "openflowbi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openflowbi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--record-mode=none -m \"not postgres\""
markers = [
    "postgres: needs a real Postgres via testcontainers/Docker - excluded from the default (zero-network) run, see M7.4",
]

[dependency-groups]
dev = [
    "dlt[duckdb,filesystem]>=1.30.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
    "vcrpy>=8.3.0",
]
