[project]
name = "open-flow-bi"
version = "0.1.0"
description = "Self-hosted Jira flow-metrics extractor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb,filesystem,parquet,postgres]>=1.30.0",
    "hishel>=1.4.0",
    "pendulum>=3.2.0",
    "pydantic-settings",
    "pyrate-limiter>=4.5.0",
    "rich",
    "structlog",
    "typer",
]

[project.scripts]
flowbi = "openflowbi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openflowbi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--record-mode=none"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "narwhals>=2.26.0",
    "pandera>=0.33.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "vcrpy>=8.3.0",
]
