views:
  - name: flow
    description: >
      Fast-path view over raw Jira issues (docs/phase4-cube-dashboard-design.md).
      What a Superset user picks first — not the raw `issues` cube directly.
    cubes:
      - join_path: issues
        includes:
          - issue_key
          - project_key
          - status_name
          - assignee_name
          - priority_name
          - created_at
          - updated_at
          - count

      # Phase 3a is done (docs/phase3-field-selection-design.md 3a.3/3a.4) —
      # analytics.issue_status_interval exists, built by `flowbi transform`.
      # No existing Superset chart built against this view needed to change,
      # only this file (docs/phase4-cube-dashboard-design.md §2's "the shape
      # doesn't change" claim).
      #
      # status_name is aliased: `issues.status_name` (above) is the issue's
      # *current* status; this cube's status_name is whichever status a given
      # interval *row* represents (a past one, for a closed interval) - two
      # different things that happen to share a name across cubes. Cube's
      # view compiler rejects the collision outright ("Included member
      # 'status_name' conflicts with existing member of 'flow'") rather than
      # silently picking one, found live wiring this up in Superset.
      - join_path: issues.issue_status_interval
        includes:
          - name: status_name
            alias: interval_status_name
          - entered_at
          - exited_at
          - total_duration_seconds
          - avg_duration_days

      # M9b full path, second cube (docs/phase4-cube-dashboard-design.md
      # §4.3/§4.4). Add each promoted column here too, alongside its new
      # dimension in issue.yml, as fields get promoted — resolution_name is
      # the first real example (2026-09-22).
      - join_path: issues.issue
        includes:
          - name: rebuilt_at
            alias: issue_rebuilt_at
          - resolution_name

      # Bridge-table cube for array-valued fields (README.md's "Array-valued
      # fields" subsection) - fix_version.yml, closing the gap the "For
      # developers" section flagged. `count` and `value` are aliased: this
      # cube's own `count` measure counts (issue, fix-version) pairs, not
      # issues (an issue with 3 fix versions counts 3 times here) - a
      # different meaning from the top-level `count` above, so the view
      # compiler's name-collision rule (same one that forced
      # interval_status_name below) applies here too.
      - join_path: issues.fix_version
        includes:
          - name: value
            alias: fix_version_name
          - name: count
            alias: fix_version_count
