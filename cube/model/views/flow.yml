views:
  - name: flow
    description: >
      Jira issues with their status history and promoted fields.
      What a Superset user picks — not the raw cubes directly.
    cubes:
      - join_path: issues
        includes:
          - issue_key
          - project_key
          - status_name
          - assignee_name
          - priority_name
          - created_at
          - updated_at
          - count

      # Status periods from analytics.issue_status_interval, built by
      # `flowbi transform`.
      #
      # status_name is aliased: `issues.status_name` (above) is the issue's
      # *current* status; this cube's status_name is whichever status a given
      # interval *row* represents (a past one, for a closed interval) - two
      # different things that happen to share a name across cubes. Cube's
      # view compiler rejects the collision outright ("Included member
      # 'status_name' conflicts with existing member of 'flow'") rather than
      # silently picking one.
      - join_path: issues.issue_status_interval
        includes:
          - name: status_name
            alias: interval_status_name
          - entered_at
          - exited_at
          - total_duration_seconds
          - avg_duration_days

      # Promoted columns from analytics.issue. Add each promoted column here
      # too, alongside its new dimension in issue.yml — resolution_name is
      # the reference to copy.
      - join_path: issues.issue
        includes:
          - name: rebuilt_at
            alias: issue_rebuilt_at
          - resolution_name

      # Bridge-table cube for an array-valued field (fix_version.yml). `count`
      # and `value` are aliased: this cube's own `count` measure counts
      # (issue, fix-version) pairs, not issues (an issue with 3 fix versions
      # counts 3 times here) - a different meaning from the top-level `count`
      # above, so the view compiler's name-collision rule (same one that
      # forced interval_status_name above) applies here too.
      - join_path: issues.fix_version
        includes:
          - name: value
            alias: fix_version_name
          - name: count
            alias: fix_version_count
