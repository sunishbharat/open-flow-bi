cubes:
  - name: issues
    sql_table: jira_raw.issues

    # Reads jira_raw directly via cube_reader's read-only grant on this table
    # (migrations/sql/cube_reader_grants.sql), so it works before any field
    # is promoted. Every cube needs a primary_key or a one-to-many join
    # silently inflates counts (cube/README.md's modeling rules).
    #
    # The join to issue_status_interval is declared HERE, not on that cube,
    # even though issue_status_interval is the "many" side: Cube's SQL API
    # join-graph builder needs the edge declared in the same direction as the
    # flow view's `join_path: issues.issue_status_interval`
    # (cube/model/views/flow.yml), or it fails with "Can't find join path to
    # join 'issues,issue_status_interval'" the moment a query selects only
    # issue_status_interval-side members - even though the same join resolves
    # fine when issue_status_interval is queried on its own, outside the view.
    joins:
      - name: issue_status_interval
        relationship: one_to_many
        sql: "{CUBE}.issue_id = {issue_status_interval.issue_id} AND {CUBE}.instance_id = {issue_status_interval.instance_id}"

      # Same join-direction reasoning as above: declared on this cube, not
      # on issue.yml, so the flow view's `join_path: issues.issue` resolves
      # regardless of which side's members a query actually selects.
      - name: issue
        relationship: one_to_one
        sql: "{CUBE}.issue_id = {issue.issue_id} AND {CUBE}.instance_id = {issue.instance_id}"

      # Same join-direction reasoning again: declared on this cube, not on
      # fix_version.yml, so `join_path: issues.fix_version` resolves.
      # one_to_many because an issue can carry more than one fix version.
      - name: fix_version
        relationship: one_to_many
        sql: "{CUBE}.issue_id = {fix_version.issue_id} AND {CUBE}.instance_id = {fix_version.instance_id}"

    dimensions:
      - name: issue_id
        sql: issue_id
        type: number
        primary_key: true

      - name: issue_key
        sql: issue_key
        type: string

      - name: instance_id
        sql: instance_id
        type: string

      - name: project_key
        # jira_raw.fields is jsonb passthrough (raw JSON by design) — extracted
        # here, not promoted to a column: a dimension can read JSON directly
        # without the promotion engine.
        sql: "{CUBE}.fields->'project'->>'key'"
        type: string

      - name: status_name
        # Grouped by display string, not status id, because there's no
        # status-id lookup table yet. A status rename retroactively changes
        # historical grouping — accepted for now, and called out here so it
        # isn't mistaken for an oversight. For status history, use
        # issue_status_interval (interval_status_name in the flow view).
        sql: "{CUBE}.fields->'status'->>'name'"
        type: string

      - name: assignee_name
        sql: "{CUBE}.fields->'assignee'->>'displayName'"
        type: string

      - name: priority_name
        # Same caveat as status_name above: grouped/filtered by
        # display string (Jira has no stable priority id exposed here),
        # not an id - a priority scheme rename would retroactively change
        # historical filtering. Acceptable for now, same reasoning as
        # status_name's own comment.
        sql: "{CUBE}.fields->'priority'->>'name'"
        type: string

      - name: created_at
        sql: created_at
        type: time

      - name: updated_at
        sql: updated_at
        type: time

    measures:
      - name: count
        type: count
