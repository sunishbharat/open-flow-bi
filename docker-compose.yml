services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openflowbi
      POSTGRES_USER: flowbi
      POSTGRES_PASSWORD: flowbi
    # Host port 5433 avoids clashing with a local Postgres on 5432. Every
    # published port is bound to 127.0.0.1: this stack is for one user on one
    # machine, with fixed local passwords and Cube in dev mode.
    ports: ["127.0.0.1:5433:5432"]
    # Named volume: without it the data lives in an anonymous volume tied to one
    # container, and `docker compose down` + `up` silently starts an empty
    # database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d: without it pg_isready also targets a database named after the user
      # ("flowbi"), which doesn't exist and fills the log with FATALs.
      test: ["CMD-SHELL", "pg_isready -U flowbi -d openflowbi"]
      interval: 2s
      retries: 10
      # A first start runs initdb, which stops and restarts the server; failures
      # during this window don't count, so dependents don't give up too early.
      start_period: 30s

  # Semantic layer over Postgres. Local dev only — Cube Store
  # (pre-aggregations) intentionally not added here; nothing in the model
  # needs it yet. Pinned: bump deliberately, then re-run the cube-smoke CI job.
  cube:
    image: cubejs/cube:v1.7.48
    ports:
      - "127.0.0.1:4000:4000"     # REST API + Playground
      - "127.0.0.1:15432:15432"   # Postgres-wire SQL API — what Superset connects to
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: openflowbi
      CUBEJS_DB_USER: cube_reader
      CUBEJS_DB_PASS: ${CUBE_READER_PW}
      # Local-only: dev mode is an authentication bypass — never set this
      # outside docker-compose. See cube/README.md.
      CUBEJS_DEV_MODE: "true"
      # Credentials for the SQL API itself (distinct from CUBEJS_DB_* above,
      # which is Cube's own connection *to* Postgres). Set explicitly rather
      # than relying on dev-mode's auth bypass extending to this port too —
      # unverified whether it does, and cheap to just set it.
      CUBEJS_SQL_USER: ${CUBE_SQL_USER}
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD}
    volumes:
      - ./cube:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy

  # The dashboard-building surface — Cube's own Playground is dev-only, not
  # this. SQLite metadata store (default image behavior) is fine for local dev;
  # revisit if this ever needs to survive a container rebuild for real.
  # Pinned: bump deliberately.
  superset:
    image: apache/superset:6.1.0
    # The Postgres driver is installed at start-up into a named volume, which
    # Docker creates root-owned, so the image's default user (uid 1000) can't
    # write to it. Root, local dev only.
    user: root
    ports: ["127.0.0.1:8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      # Antivirus or a corporate proxy that inspects HTTPS breaks the driver
      # install below too; PIP_CERT makes pip trust the same combined bundle
      # the flowbi service uses (pip only - nothing else in Superset reads it).
      PIP_CERT: /certs/ca.pem
      # The driver lives in its own directory, not the image's site-packages,
      # so this doesn't depend on the image's Python version, and an image
      # upgrade isn't shadowed by a volume holding an older site-packages.
      # /app/pythonpath is the image's own default PYTHONPATH.
      PYTHONPATH: /app/pythonpath:/app/superset_drivers
    volumes:
      - ${FLOWBI_BUILD_CA_BUNDLE:-./.build-ca.pem}:/certs/ca.pem:ro
      - superset_home:/app/superset_home
      # Persist the pip-installed driver across container restarts instead of
      # re-downloading it on every `docker compose up`: a re-download needs
      # pypi.org, and can fail intermittently behind HTTPS inspection.
      - superset_drivers:/app/superset_drivers
    entrypoint: >
      /bin/bash -c "
      (test -f /app/superset_drivers/psycopg2/__init__.py ||
      pip install --no-cache-dir --target=/app/superset_drivers psycopg2-binary) &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@openflowbi.local --password ${SUPERSET_ADMIN_PW} &&
      superset init &&
      /usr/bin/run-server.sh"
    depends_on:
      cube:
        condition: service_started

  # The openflowbi/core image (Dockerfile), for running the pipeline in a
  # container against the compose Postgres. Profile-gated: `docker compose up`
  # does not start it. One-off commands, e.g.:
  #   docker compose run --rm flowbi alembic upgrade head
  #   docker compose run --rm flowbi flowbi extract issues --destination postgres
  flowbi:
    profiles: ["tools"]
    image: openflowbi/core:dev
    build:
      context: .
      secrets: [ca]
    env_file: .env
    environment:
      # Inside the compose network Postgres is postgres:5432, not localhost:5433.
      FLOWBI_POSTGRES_DSN: postgresql://flowbi:flowbi@postgres:5432/openflowbi
      # HTTPS inspection applies to container traffic too, so Jira calls need
      # the same combined bundle at runtime. Mounted, never baked into the image.
      REQUESTS_CA_BUNDLE: /certs/ca.pem
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ${FLOWBI_BUILD_CA_BUNDLE:-./.build-ca.pem}:/certs/ca.pem:ro
      - ./out:/app/out
      - flowbi_dlt:/home/flowbi/.dlt
    depends_on:
      postgres:
        condition: service_healthy

# CA bundle for TLS-intercepting proxies/antivirus, used by the image build (as a
# secret, never copied into the image) and mounted into flowbi and superset.
# Create it with `uv run python scripts/make_ca_bundle.py` (public CAs + this
# machine's trusted roots); FLOWBI_BUILD_CA_BUNDLE overrides the path.
secrets:
  ca:
    file: ${FLOWBI_BUILD_CA_BUNDLE:-./.build-ca.pem}

volumes:
  pgdata:
  flowbi_dlt:
  superset_home:
  superset_drivers:
